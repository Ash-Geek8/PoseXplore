<!DOCTYPE html>
<html lang="en">
<head>
    <title>Main Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container">
        <h1>Select a Tracking Option</h1>
        <ul id="option_container">
            {% for option in options %}
            <li id="option" track-url="{{ url_for('track', function_name=option) }}">
                <a href="{{ url_for('track', function_name=option) }}">{{ option.replace('_', ' ') }}</a>
                <img src="{{ url_for('static', filename='images/' + option + '.jpg') }}" alt="{{ option.replace('_', ' ') }}" 
                style="width:200px; height:130px; margin:10px 20px 5px 3px">
            </li>
            {% endfor %}
        </ul>
        <button id="more_button" class="btn">MORE</button>
        <button id="refresh_button" class="btn" style="display: none;">LESS</button>
    </div>

    <script>
        document.querySelectorAll('li').forEach(li => {
            li.addEventListener("click", function(){
                const url = this.getAttribute("track-url");
                window.location.href = url;
            });
        });

        // Embed the base URL for constructing new options
        const trackBaseUrl = "{{ url_for('track', function_name='') }}";
        const imageBaseUrl = "{{ url_for('static', filename='images/') }}";

        // Handle "More" button click
        document.getElementById("more_button").addEventListener("click", async function() {
            const moreButton = document.getElementById("more_button");
            const refreshButton = document.getElementById("refresh_button");

            // Fetch additional options from the server
            const response = await fetch("{{ url_for('more_options') }}");
            const data = await response.json();

            // Add the additional options to the list
            const optionContainer = document.getElementById("option_container");
            data.options.forEach(option => {
                const li = document.createElement("li");
                li.setAttribute("track-url", trackBaseUrl + option);
                li.innerHTML = `
                    <a href="${trackBaseUrl + option}">${option.replace('_', ' ')}</a>
                    <img src="${imageBaseUrl + option}.jpg" alt="${option.replace('_', ' ')}" 
                    style="width:200px; height:130px; margin:10px 20px 5px 3px">
                `;
                optionContainer.appendChild(li);

                // Add click event listener to the newly created options
                li.addEventListener("click", function() {
                    const url = this.getAttribute("track-url");
                    window.location.href = url;
                });
            });

            // Hide "More" button and show "Refresh" button
            moreButton.style.display = "none";
            refreshButton.style.display = "inline-block";
        });

        // Handle "Refresh" button click
        document.getElementById("refresh_button").addEventListener("click", function() {
            window.location.reload(); // Reload the page to reset the UI
        });
    </script>
</body>
</html>
