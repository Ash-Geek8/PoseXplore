<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Page</title>
    <link href="https://fonts.googleapis.com/css?family=Kavoon&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Jomhuria&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/track.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Tracking: {{ function_name.replace('_', ' ') }}</h1>
        </header>

        <main>
            <!-- Hidden Input to Store Function Name -->
            <input type="hidden" id="function-name" value="{{ function_name }}">

            <!-- Video Feed -->
            <div class="video-container" onclick="openFullscreen()">
                <video id="webcam" autoplay></video>
                <img id="processed-frame" >
            </div>

            <!-- Canvas for Capturing Frames -->
            <canvas id="canvas" style="display: none;"></canvas>

            <!-- Controls -->
            <div class="controls">
                <button id="toggle-button" class="btn btn-toggle">Switch to Normal Frame</button>
                <a href="{{ url_for('results') }}" class="btn btn-view">View Results</a>
                <a href="{{ url_for('main_page') }}" class="btn btn-back">Back</a>
            </div>
        </main>
    </div>

    <script>

        function openFullscreen() {
            const img = document.getElementById("processed-frame");
            if (img.requestFullscreen) {
                img.requestFullscreen();
            } else if (img.mozRequestFullScreen) { // Firefox
                img.mozRequestFullScreen();
            } else if (img.webkitRequestFullscreen) { // Chrome, Safari and Opera
                img.webkitRequestFullscreen();
            } else if (img.msRequestFullscreen) { // IE/Edge
                img.msRequestFullscreen();
            }
        }

        const toggleButton = document.getElementById('toggle-button');
        const videoElement = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const processedFrame = document.getElementById('processed-frame');
        let displayMode = 'blank';
        
        let lastFrameTime = 0;
        const FRAME_INTERVAL = 1000 / 5; // 5 FPS
        
        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, frameRate: { ideal: 5, max: 5 } } })
                .then(stream => {
                    videoElement.srcObject = stream;
                    videoElement.play();
                    videoElement.onloadedmetadata = () => {
                        canvas.width = videoElement.videoWidth;
                        canvas.height = videoElement.videoHeight;
                        requestAnimationFrame(captureFrame);
                    };
                })
                .catch(error => console.error('Webcam Error:', error));
        }
        
        function captureFrame(timestamp) {
            if (timestamp - lastFrameTime >= FRAME_INTERVAL) {
                lastFrameTime = timestamp;
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        
                // Reduce image quality to reduce size
                let frameData = canvas.toDataURL('image/jpeg', 0.5); // 50% quality
        
                sendFrameToFlask(frameData);
            }
        
            // Use requestAnimationFrame for smoother performance
            requestAnimationFrame(captureFrame);
        }
        
        let isSendingFrame = false; // Prevent backpressure if server is slow
        
        async function sendFrameToFlask(frameData) {
            if (isSendingFrame) return; // Skip frame if previous one is still processing
            isSendingFrame = true;
        
            let functionNameElement = document.getElementById('function-name');
            if (!functionNameElement) {
                console.error("Error: function-name element not found.");
                isSendingFrame = false;
                return;
            }
        
            let functionName = functionNameElement.value;
        
            try {
                const response = await fetch(`/process_frame/${functionName}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ frame: frameData, display_mode: displayMode })
                });
        
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server responded with ${response.status}: ${errorText}`);
                }
        
                const data = await response.json();
                if (data.processed_frame) {
                    processedFrame.src = 'data:image/jpeg;base64,' + data.processed_frame;
                } else if (data.error) {
                    console.error("Server Error:", data.error);
                }
            } catch (error) {
                console.error('Frame Sending Error:', error);
            } finally {
                isSendingFrame = false; // Allow next frame to send
            }
        }
        
        toggleButton.addEventListener('click', () => {
            displayMode = displayMode === 'blank' ? 'normal' : 'blank';
            toggleButton.textContent = displayMode === 'blank' ? 'Switch to Normal Frame' : 'Switch to Blank Frame';
        });
        
        window.onload = startWebcam;


    </script>
</body>
</html>
